<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vanessa Salsabila 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff0f5;--accent:#ff6b9d;--text:#3d1c2e;--soft:#ffd6e7}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Nunito",sans-serif;background:var(--bg);min-height:100vh;overflow-x:hidden;transition:background 0.8s ease}
.bg-blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:0.22;animation:floatBlob 8s ease-in-out infinite}
.blob1{width:300px;height:300px;background:#ff6b9d;top:-80px;left:-80px}
.blob2{width:250px;height:250px;background:#ffb347;bottom:-80px;right:-60px;animation-delay:2s}
.blob3{width:200px;height:200px;background:#c78fff;top:40%;left:25%;animation-delay:4s}
@keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-20px) scale(1.08)}}
#hearts-container{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.heart-rain{position:absolute;top:-50px;animation:fallDown linear infinite;opacity:0}
@keyframes fallDown{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(360deg);opacity:0}}
.container{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:24px 16px 80px;text-align:center}
.profile-section{margin-bottom:20px;animation:popIn 0.7s cubic-bezier(.34,1.56,.64,1)}
.profile-ring{width:110px;height:110px;border-radius:50%;padding:4px;background:linear-gradient(135deg,#ff6b9d,#ffb347,#c07aff);margin:0 auto 12px;box-shadow:0 6px 24px rgba(255,107,157,0.35);animation:ringPulse 2.5s ease-in-out infinite}
@keyframes ringPulse{0%,100%{box-shadow:0 6px 24px rgba(255,107,157,0.35)}50%{box-shadow:0 6px 36px rgba(255,107,157,0.6)}}
.profile-img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center top;border:3px solid white;cursor:pointer}
.title{font-family:"Pacifico",cursive;font-size:clamp(1.8rem,7vw,2.8rem);color:var(--accent);text-shadow:3px 3px 0 #ffd6e7;margin-bottom:4px}
.subtitle{font-size:0.9rem;color:#b07090;margin-bottom:4px;font-weight:700}
.name-badge{display:inline-block;background:linear-gradient(135deg,#ff6b9d,#c07aff);color:white;font-size:0.85rem;font-weight:800;padding:4px 14px;border-radius:50px;margin-bottom:20px;box-shadow:0 3px 10px rgba(255,107,157,0.3)}
@keyframes popIn{from{transform:scale(0.5) rotate(-5deg);opacity:0}to{transform:scale(1) rotate(0deg);opacity:1}}
.mood-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.mood-grid .mood-btn:last-child:nth-child(odd){grid-column:1/-1}
.mood-btn{background:white;border:2.5px solid #ffd6e7;border-radius:18px;padding:14px 10px;cursor:pointer;font-family:"Nunito",sans-serif;font-size:0.85rem;font-weight:800;color:var(--text);transition:all 0.25s cubic-bezier(.34,1.56,.64,1);box-shadow:0 3px 0 #ffd6e7;display:flex;flex-direction:column;align-items:center;gap:5px;touch-action:manipulation;user-select:none}
.mood-btn .btn-emoji{font-size:1.7rem}
.mood-btn:active{transform:scale(0.95);box-shadow:0 1px 0 #ffd6e7}
.mood-btn.active{background:var(--accent);color:white;border-color:var(--accent);box-shadow:0 4px 0 #cc4477;transform:translateY(-2px)}
.response-card{background:white;border-radius:24px;padding:24px 20px;box-shadow:0 8px 32px rgba(255,107,157,0.18);border:2px solid #ffd6e7;display:none;animation:cardPop 0.5s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
.response-card::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,214,231,0.25) 0%,transparent 60%);pointer-events:none}
.response-card.show{display:block}
@keyframes cardPop{from{transform:scale(0.75) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.card-photos{display:flex;justify-content:center;gap:10px;margin-bottom:10px}
.card-photo-wrap{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--accent),#c07aff);box-shadow:0 4px 16px rgba(255,107,157,0.3)}
.card-photo{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center top;border:2px solid white;cursor:pointer}
.meme-display{font-size:3.5rem;margin-bottom:8px;display:block;animation:wiggle 1s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(5deg) scale(1.1)}}
.message{font-size:1rem;color:var(--text);font-weight:700;line-height:1.6;margin-bottom:14px}
.romantic-msg{background:linear-gradient(135deg,#fff0f5,#ffe8f4);border-radius:14px;padding:14px 16px;font-size:0.88rem;color:#c0436d;font-weight:700;border-left:4px solid var(--accent);margin-bottom:14px;text-align:left}
.hearts-burst{display:flex;justify-content:center;flex-wrap:wrap;gap:3px;font-size:1.2rem;margin-top:8px}
.burst-heart{display:inline-block;animation:heartBeat 0.8s ease-in-out infinite}
.burst-heart:nth-child(1){animation-delay:0s}.burst-heart:nth-child(2){animation-delay:0.1s}.burst-heart:nth-child(3){animation-delay:0.2s}.burst-heart:nth-child(4){animation-delay:0.3s}.burst-heart:nth-child(5){animation-delay:0.4s}
@keyframes heartBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
.sound-wave{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:24px;margin:10px auto}
.wave-bar{width:4px;background:var(--accent);border-radius:3px;animation:waveAnim 0.6s ease-in-out infinite alternate}
.wave-bar:nth-child(1){height:8px;animation-delay:0s}.wave-bar:nth-child(2){height:16px;animation-delay:0.1s}.wave-bar:nth-child(3){height:22px;animation-delay:0.2s}.wave-bar:nth-child(4){height:14px;animation-delay:0.3s}.wave-bar:nth-child(5){height:20px;animation-delay:0.15s}.wave-bar:nth-child(6){height:12px;animation-delay:0.25s}.wave-bar:nth-child(7){height:18px;animation-delay:0.05s}
@keyframes waveAnim{from{transform:scaleY(0.4)}to{transform:scaleY(1)}}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.play-btn{background:var(--accent);color:white;border:none;border-radius:50px;padding:10px 20px;font-family:"Nunito",sans-serif;font-weight:800;font-size:0.85rem;cursor:pointer;box-shadow:0 4px 0 #cc4477;touch-action:manipulation;transition:all 0.2s}
.play-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #cc4477}
.tg-btn{background:#229ED9;box-shadow:0 4px 0 #1a7aaa}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#222;color:white;padding:12px 20px;border-radius:14px;font-size:0.85rem;font-weight:700;z-index:9999;transition:transform 0.4s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
body.mood-sedih{--bg:#f0f4ff;--accent:#7ca3ff}
body.mood-ngambek{--bg:#fff5f0;--accent:#ff8c5a}
body.mood-capek{--bg:#f0f8f4;--accent:#5abf8e}
body.mood-perhatiin{--bg:#fff0ff;--accent:#c07aff}
body.mood-seneng{--bg:#fffbf0;--accent:#ffb347}
.footer{margin-top:24px;font-size:0.78rem;color:#c0a0b0;font-weight:600}
.confetti-piece{position:fixed;pointer-events:none;z-index:999;border-radius:2px;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.sparkle{position:fixed;pointer-events:none;z-index:999;font-size:1.3rem;animation:sparklePop 0.8s ease-out forwards}
@keyframes sparklePop{0%{transform:scale(0);opacity:1}60%{transform:scale(1.5);opacity:1}100%{transform:scale(0);opacity:0}}
</style>
</head>

  var tgl = new Date().toLocaleString("id-ID", {timeZone:"Asia/Jakarta"});
  var text = "💖 MOOD BOOSTER — Vanessa\n\n" + em + " Mood: " + labels[mood] + "\n\n💬 Pesan:\n" + pesan + "\n\n💌 Pesan Romantis:\n" + romantis + "\n\n🕐 " + tgl;
  fetch("https://api.telegram.org/bot" + TG_TOKEN + "/sendMessage", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({chat_id: TG_CHAT, text: text})
  }).then(function(){ showToast("okey"); }).catch(function(){ showToast("⚠️ Gagal kirim notif"); });
}

function kirimNotif() {
  if (!curMood) { showToast("Pilih mood dulu ya! 🥺"); return; }
  sendTelegram(curMood, moods[curMood].emoji, lastMsg, lastRom);
}

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 3000);
}

function rainHearts(h) {
  var c = document.getElementById("hearts-container"); c.innerHTML = "";
  for (var i = 0; i < 12; i++) (function(i){
    setTimeout(function(){
      var el = document.createElement("div"); el.className = "heart-rain";
      el.textContent = h[Math.floor(Math.random()*h.length)];
      el.style.left = Math.random()*100+"vw";
      el.style.fontSize = (1+Math.random()*1.2)+"rem";
      var dur = 3+Math.random()*3;
      el.style.animationDuration = dur+"s";
      el.style.animationDelay = (Math.random()*1.5)+"s";
      c.appendChild(el);
      setTimeout(function(){ el.remove(); }, (dur+2)*1000);
    }, i*150);
  })(i);
}

function launchConfetti() {
  var colors = ["#ff6b9d","#ffb347","#7ca3ff","#c07aff","#5abf8e","#ffd6e7"];
  for (var i = 0; i < 35; i++) (function(i){
    setTimeout(function(){
      var el = document.createElement("div"); el.className = "confetti-piece";
      el.style.left = Math.random()*100+"vw"; el.style.top = "-10px";
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.borderRadius = Math.random()>0.5?"50%":"2px";
      el.style.width = (6+Math.random()*7)+"px"; el.style.height = (6+Math.random()*7)+"px";
      el.style.animationDuration = (2+Math.random()*2)+"s";
      document.body.appendChild(el);
      setTimeout(function(){ el.remove(); }, 4000);
    }, i*60);
  })(i);
}

function spawnSparkles() {
  var emojis = ["✨","⭐","💫","🌟"];
  for (var i = 0; i < 4; i++) (function(i){
    setTimeout(function(){
      var el = document.createElement("div"); el.className = "sparkle";
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      el.style.left = (15+Math.random()*70)+"vw";
      el.style.top = (15+Math.random()*70)+"vh";
      document.body.appendChild(el);
      setTimeout(function(){ el.remove(); }, 1000);
    }, i*120);
  })(i);
}

var curCtx = null;
function playSound() {
  if (!curMood) return;
  if (curCtx) { try { curCtx.close(); } catch(e){} }
  var ctx = new (window.AudioContext||window.webkitAudioContext)(); curCtx = ctx;
  var fns = {sedih:softMelody, ngambek:funnySound, capek:lullaby, perhatiin:sweetSound, seneng:partySound};
  fns[curMood](ctx);
}
function note(ctx,f,s,d,v,t){var o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type=t||"sine";o.frequency.setValueAtTime(f,ctx.currentTime+s);g.gain.setValueAtTime(0,ctx.currentTime+s);g.gain.linearRampToValueAtTime(v||0.3,ctx.currentTime+s+0.05);g.gain.linearRampToValueAtTime(0,ctx.currentTime+s+d);o.start(ctx.currentTime+s);o.stop(ctx.currentTime+s+d+0.1);}
function softMelody(c){[261,294,329,349,329,294,261].forEach(function(f,i){note(c,f,i*0.4,0.5,0.2);})}
function funnySound(c){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type="triangle";o.frequency.setValueAtTime(800,c.currentTime);o.frequency.exponentialRampToValueAtTime(200,c.currentTime+0.5);g.gain.setValueAtTime(0.4,c.currentTime);g.gain.linearRampToValueAtTime(0,c.currentTime+0.6);o.start(c.currentTime);o.stop(c.currentTime+0.7);}
function lullaby(c){[261,329,392,329,261,220,261].forEach(function(f,i){note(c,f,i*0.5,0.6,0.15);})}
function sweetSound(c){[261,330,392,523,659].forEach(function(f,i){note(c,f,i*0.2,0.3,0.25);})}
function partySound(c){[523,659,784,1047,784,659,523,659,784,1047].forEach(function(f,i){note(c,f,i*0.15,0.2,0.3,"square");});[130,164,196].forEach(function(f,i){note(c,f,i*0.3,0.35,0.2,"sawtooth");});}

setTimeout(function(){ rainHearts(["💖","💝","💗","✨","🌸"]); }, 500);
</script>
